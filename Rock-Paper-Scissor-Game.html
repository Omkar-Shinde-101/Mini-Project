<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissor-Game</title>
    <link rel="stylesheet" href="Rock-Paper-Scissor-Game.css">
</head>
<body>
    <h1>Rock Paper Scissor Game</h1>
    <p>Choose your move</p>
    <div class="buttons">
        <button id="rock">&#x1F44A;</button>
        <button id="paper">&#x1f590;</button>
        <button id="scissor">&#x270c;</button>
    </div>
    <p id="result"></p>
    <p id="score">
        Your score:<span id="user-score"> 0 </span>
        computer score:<span id="computer-score"> 0</span>
    </p>
    <script src="Rock-Paper-Scissor-Game.js"></script>
</body>
</html>
